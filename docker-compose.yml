# Single docker-compose for local dev AND the deploy VM (per design §14).
# Services wired this session: postgres (Timescale), mock, control, web.
# coordinator + worker-1..N are SUPERVISED engine work — left as commented
# placeholders so the topology is documented but nothing half-built runs.
#
# NOTE: these were authored during a session with no Docker runtime available,
# so they are NOT yet `docker compose up`-verified end to end. The mock and
# control plane were verified natively (cargo run / go test against a local
# Postgres). See docs/BUILD_LOG.md.

name: correctness-bench

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [bench]

  mock:
    build:
      context: ./mock
    # Fixed port so gates and demos reproduce.
    ports:
      - "8080:8080"
    environment:
      MOCK_ADDR: "0.0.0.0:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [bench]

  control:
    build:
      context: ./control
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # libpq-style DSN consumed by pgx.
      DATABASE_URL: "postgres://bench:bench@postgres:5432/bench?sslmode=disable"
      CONTROL_ADDR: ":8000"
      # Fire the fleet on run creation, and tell the coordinator how to reach us
      # back for tick/finalize callbacks.
      COORDINATOR_ADMIN_URL: "http://coordinator:9091"
      CONTROL_SELF_URL: "http://control:8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "control"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=local"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [bench]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    depends_on:
      - control
    environment:
      # The browser calls same-origin /v1/...; the vite dev server proxies those
      # to the control service on the compose network.
      CONTROL_PROXY_TARGET: "http://control:8000"
    ports:
      - "5173:5173"
    networks: [bench]

  # wrk2 — gate #1's oracle. Lives behind the `bench` profile so `docker compose
  # up` doesn't start it; invoke explicitly:
  #   docker compose --profile bench run --rm wrk2 -t4 -c100 -d60s -R2000 \
  #       --latency http://mock:8080/api?mode=healthy\&base_latency_ms=20
  wrk2:
    profiles: [bench]
    build:
      context: ./tools/wrk2
    image: correctness-bench-wrk2
    networks: [bench]
    depends_on: [mock]

  # ---- ENGINE FLEET (gRPC coordinator + worker_node replicas) ----
  # Two binaries baked into the engine image; entrypoint picks one.
  coordinator:
    build: { context: ., dockerfile: engine/Dockerfile }
    image: correctness-bench-engine
    entrypoint: ["/usr/local/bin/coordinator"]
    command: ["--grpc-addr", "0.0.0.0:9090", "--admin-addr", "0.0.0.0:9091"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "coordinator"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=local"
    ports:
      - "9091:9091"   # admin HTTP only; gRPC is internal to the bench network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks: [bench]

  worker_node:
    build: { context: ., dockerfile: engine/Dockerfile }
    image: correctness-bench-engine
    entrypoint: ["/usr/local/bin/worker_node"]
    command: [
      "--coord", "http://coordinator:9090",
      "--listen", "0.0.0.0:9092",
    ]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "worker_node"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=local"
    # WORKER_ADDRESS is derived from $HOSTNAME by the binary (compose gives
    # each replica a unique DNS-resolvable name on the bench network), so
    # peers reach us via correctness-bench-worker_node-1:9092, etc.
    depends_on:
      coordinator:
        condition: service_healthy
    deploy:
      replicas: 2   # docker compose up --scale worker_node=N to vary
    networks: [bench]

  # ---- OBSERVABILITY: traces (Jaeger) + logs (Loki) + UI (Grafana) ----
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./ops/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
      - "13133:13133" # health
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    networks: [bench]

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      # 4317 is owned by otel-collector; Jaeger receives OTLP from it internally.
    networks: [bench]

  loki:
    profiles: [observability]
    image: grafana/loki:3.5
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    networks: [bench]

  promtail:
    profiles: [observability]
    image: grafana/promtail:3.5
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./ops/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_started
    networks: [bench]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    networks: [bench]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.5.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_started
      jaeger:
        condition: service_started
    networks: [bench]

volumes:
  pgdata:
  lokidata:
  grafanadata:
  promdata:

networks:
  bench:
    driver: bridge
