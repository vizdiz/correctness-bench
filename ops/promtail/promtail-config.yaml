server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Scrape every container's JSON log file on the host, parse the json-line
# control + engine emit, and tag with service + container_name labels.
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
    pipeline_stages:
      # Try parsing as JSON (control, engine). Non-JSON lines fall through with
      # the raw text preserved as `line`.
      - json:
          expressions:
            level: level
            msg: msg
            run_id: run_id
            trace_id: trace_id
          drop_malformed: false
      - labels:
          level:
