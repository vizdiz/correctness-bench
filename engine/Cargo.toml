[package]
name = "engine"
version = "0.1.0"
edition = "2021"
publish = false

# The benchmarker's hot path: COO-correct scheduler, HDR histograms (corrected
# + uncorrected), open-loop load against any HTTP target. This crate is the
# gate-#1 owner (gates/gate1_wrk2_agreement.md). The coordinator + gRPC + fleet
# bits are not in this MVP — single worker, single thread, single binary.

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "engine-worker"
path = "src/bin/worker.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal", "sync", "io-util"] }
http = "1"
httparse = "1"
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
mock = { path = "../mock" }
axum = "0.8"
http = "1"
