[package]
name = "engine"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# The benchmarker's hot path: COO-correct scheduler, HDR histograms (corrected
# + uncorrected), open-loop load against any HTTP target. Gate #1 + #2 owner.
#
# Binaries:
#   engine-worker  — CLI-driven single-worker (the one CLI/MCP fire today)
#   coordinator    — gRPC server for Bench (Register/Heartbeat); dials
#                    registered workers' Bench (RunSlice/Abort) to distribute.
#   worker         — gRPC peer of coordinator: registers on startup, serves
#                    RunSlice/Abort, runs assigned slices via engine::run_with_ticks.

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "engine-worker"
path = "src/bin/worker.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal", "sync", "io-util"] }
http = "1"
httparse = "1"
hdrhistogram = "7"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 1 Hz tick pusher → control plane; not on the hot path.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# gRPC for the worker↔coordinator surface (contracts/bench.proto, FROZEN).
# prost pinned to tonic 0.13's transitive version so the codec types align.
tonic = { version = "0.13", default-features = false, features = ["channel", "codegen", "prost", "router", "server", "transport"] }
prost = "0.13"
prost-types = "0.13"
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
# Coordinator's admin HTTP surface (POST /admin/runs); not on the bench hot path.
axum = "0.8"

[build-dependencies]
tonic-build = { version = "0.13", default-features = false, features = ["prost"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
mock = { path = "../mock" }
axum = "0.8"
http = "1"
